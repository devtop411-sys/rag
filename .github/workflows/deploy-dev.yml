name: Deploy DEV to AWS EC2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy DEV
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2 (dev)
        uses: appleboy/ssh-action@v1.0.3
        env:
          VOYAGE_API_KEY:   ${{ secrets.VOYAGE_API_KEY }}
          QDRANT_URL:       ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY:   ${{ secrets.QDRANT_API_KEY }}
          API_KEY:          ${{ secrets.DEV_API_KEY }}
          SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
          DIFY_API_KEY:     ${{ secrets.DIFY_API_KEY }}
          GOOGLE_CLIENT_ID:            ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:        ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MCP_GOOGLE_CLIENT_ID:        ${{ secrets.MCP_GOOGLE_CLIENT_ID }}
          MCP_GOOGLE_CLIENT_SECRET:    ${{ secrets.MCP_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DRIVE_CLIENT_ID }}
          OPENAI_API_KEY:              ${{ secrets.OPENAI_API_KEY }}
          S3_BUCKET:                   ${{ secrets.DEV_S3_BUCKET }}
          AWS_REGION:                  ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID:           ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:       ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OAUTH_SIGNING_SECRET:        ${{ secrets.DEV_OAUTH_SIGNING_SECRET }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs: VOYAGE_API_KEY,QDRANT_URL,QDRANT_API_KEY,API_KEY,SLACK_BOT_TOKEN,DIFY_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MCP_GOOGLE_CLIENT_ID,MCP_GOOGLE_CLIENT_SECRET,VITE_GOOGLE_DRIVE_CLIENT_ID,OPENAI_API_KEY,S3_BUCKET,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,OAUTH_SIGNING_SECRET
          script: |
            set -e

            # Clone or update dev branch
            if [ -d "$HOME/rag-demo-dev/.git" ]; then
              cd "$HOME/rag-demo-dev"
              git fetch origin dev
              git reset --hard origin/dev
            else
              rm -rf "$HOME/rag-demo-dev"
              git clone -b dev https://github.com/${{ github.repository }}.git "$HOME/rag-demo-dev"
              cd "$HOME/rag-demo-dev"
            fi

            cd "$HOME/rag-demo-dev"

            # Create .env file (dev-specific values)
            echo "VOYAGE_API_KEY=$VOYAGE_API_KEY"     > .env
            echo "VOYAGE_MODEL=voyage-3.5"           >> .env
            echo "QDRANT_URL=$QDRANT_URL"            >> .env
            echo "QDRANT_API_KEY=$QDRANT_API_KEY"    >> .env
            echo "QDRANT_COLLECTION=investment_memos_dev" >> .env
            echo "API_KEY=$API_KEY"                  >> .env
            echo "SLACK_BOT_TOKEN=$SLACK_BOT_TOKEN"  >> .env
            echo "DIFY_API_KEY=$DIFY_API_KEY"        >> .env
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"         >> .env
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
            echo "MCP_GOOGLE_CLIENT_ID=$MCP_GOOGLE_CLIENT_ID" >> .env
            echo "MCP_GOOGLE_CLIENT_SECRET=$MCP_GOOGLE_CLIENT_SECRET" >> .env
            echo "VITE_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"               >> .env
            echo "VITE_GOOGLE_DRIVE_CLIENT_ID=$VITE_GOOGLE_DRIVE_CLIENT_ID" >> .env
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"                          >> .env
            echo "S3_BUCKET=$S3_BUCKET"                          >> .env
            echo "AWS_REGION=${AWS_REGION:-us-east-1}"          >> .env
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"         >> .env
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env
            echo "PUBLIC_BASE_URL=https://dev.rag.collider.vc"  >> .env
            echo "OAUTH_SIGNING_SECRET=$OAUTH_SIGNING_SECRET"   >> .env

            # Ports offset by 10 so both envs run on the same EC2
            echo "PORT=3011"           >> .env
            echo "MCP_PORT=3012"       >> .env
            echo "FRONTEND_PORT=8090"  >> .env

            # Start dev containers (separate compose project name = no collision)
            COMPOSE_PROJECT_NAME=rag-dev \
              docker compose \
                -f docker-compose.yml \
                -f docker-compose.dev.yml \
              down || true

            COMPOSE_PROJECT_NAME=rag-dev \
              docker compose \
                -f docker-compose.yml \
                -f docker-compose.dev.yml \
              up -d --build --remove-orphans

            docker image prune -af
